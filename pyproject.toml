[project]
name = "cua-finetune"
version = "0.1.0"
description = "Fine-tune small open-source VLMs on CUA trajectories from Supabase + Dillinger + trajectories.sh, then eval browser-in-the-loop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests",
  "pyyaml",
  "tqdm",
  "python-dotenv",
  "pillow",
  "tenacity",
  "pydantic>=2",
  "rich",
  "supabase>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "eval"]

[tool.ruff]
line-length = 120
target-version = "py310"
